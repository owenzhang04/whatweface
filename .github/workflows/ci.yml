name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck, lint, unit tests
        run: pnpm check

      - name: Build
        run: pnpm build

      - name: Build gate (broken citations must fail the build)
        run: pnpm test:gate

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Playwright + axe (every route, both themes)
        run: pnpm test:e2e

      - name: Lighthouse CI (a11y = 100, perf >= 95)
        run: |
          export CHROME_PATH="$(node -e "console.log(require('@playwright/test').chromium.executablePath())")"
          pnpm lighthouse

      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            playwright-report/
            .lighthouseci/
          retention-days: 14
